<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Disneyland Activity & Ride Tracker</title>

  <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js)"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #cfe9ff;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(255,255,255,0.25) 0, rgba(255,255,255,0.25) 6px, transparent 6px),
        radial-gradient(circle at 40px 20px, rgba(255,255,255,0.25) 0, rgba(255,255,255,0.25) 6px, transparent 6px),
        radial-gradient(circle at 30px 35px, rgba(255,255,255,0.25) 0, rgba(255,255,255,0.25) 10px, transparent 10px);
      background-size: 80px 80px;
      background-repeat: repeat;
    }

    input, button, select, textarea {
      padding: 10px;
      margin: 6px 0;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
    }

    .activity-item {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .edit-section {
      background: #f5f5f5;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      width: 100%;
    }

    .timer-box {
      margin: 15px 0;
      padding: 10px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 8px;
    }

    h2, h3 {
      color: #003a70;
    }

    #addActivityBtn {
      background: #005cba;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .summary-container {
      margin-top: 30px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h2>Disneyland Activity & Ride Tracker</h2>

<!-- Activity dropdown -->
<label>Activity Type</label>
<select id="activityType" onchange="toggleUI()">
  <option value="ride">Ride</option>
  <option value="bathroom">Bathroom Break</option>
  <option value="food">Purchased Food</option>
  <option value="security">Security Check</option>
  <option value="enterPark">Entered Park</option>
  <option value="exitPark">Left Park</option>
  <option value="leftHotel">Left Hotel</option>
</select>

<!-- Food details box -->
<div id="foodDetailsBlock" style="display:none;">
  <label>Food Details (restaurant, items, notes)</label>
  <textarea id="foodDetails"></textarea>

  <label>Cost</label>
  <div style="display:flex;align-items:center;">
    <span style="font-weight:bold;margin-right:5px;">$</span>
    <input id="foodCost" type="number" step="0.01" placeholder="0.00" style="flex:1;">
  </div>
</div>

<!-- Park selector -->
<div id="parkBlock">
  <label>Park</label>
  <select id="parkSelect" onchange="loadRides()">
    <option value="">Select a park...</option>
    <option value="DL">Disneyland</option>
    <option value="DCA">California Adventure</option>
  </select>
</div>

<!-- Ride selector -->
<div id="rideBlock">
  <label>Ride</label>
  <select id="rideSelect">
    <option value="">Select a park first...</option>
  </select>
</div>

<!-- Queue timer -->
<div class="timer-box" id="queueBox">
  <h3>Queue Timer</h3>
  <div id="queueTime">00:00</div>
  <button id="queueStart" onclick="startQueue()">Start Queue</button>
  <button id="queueStop" onclick="stopQueue()" disabled>Stop Queue</button>
</div>

<!-- Ride timer -->
<div class="timer-box" id="rideBox">
  <h3>Ride Timer</h3>
  <div id="rideTime">00:00</div>
  <button id="rideStop" onclick="stopRide()" disabled>End Ride</button>
</div>

<button id="addActivityBtn" onclick="addNonRide()">Add Activity</button>

<h3>Timeline</h3>
<div id="activityList"></div>

<h3>Ride Time & Wait Chart</h3>
<canvas id="rideChart" width="400" height="200"></canvas>

<h3>Daily Summary Chart</h3>
<div class="summary-container">
  <canvas id="summaryChart" width="400" height="250"></canvas>
</div>

<div class="stats" id="stats"></div>

<script>
/* ---------- Data ---------- */
const rideData = {
  DL: ["Space Mountain","Big Thunder Mountain Railroad","Haunted Mansion","Pirates of the Caribbean",
    "Indiana Jones Adventure","Matterhorn Bobsleds","Star Tours","Buzz Lightyear Astro Blasters",
    "Autopia","It's a Small World","Mr. Toad's Wild Ride","Alice in Wonderland",
    "Pinocchio's Daring Journey","Peter Pan's Flight","Snow White’s Enchanted Wish",
    "Dumbo","Mad Tea Party","Jungle Cruise","Winnie the Pooh","Rise of the Resistance",
    "Smuggler's Run","Roger Rabbit's Car Toon Spin","Casey Jr.","Storybook Land Boats"],

  DCA: ["Radiator Springs Racers","Incredicoaster","Toy Story Midway Mania","Guardians of the Galaxy",
    "Soarin’","Web Slingers","Grizzly River Run","Monsters Inc","Golden Zephyr",
    "Jumpin’ Jellyfish","Goofy’s Sky School","Ariel’s Undersea Adventure","Pixar Pal-A-Round",
    "Mater’s Junkyard Jamboree","Luigi’s Rollickin’ Roadsters"]
};

let queueSeconds = 0;
let rideSeconds = 0;
let queueTimer = null;
let rideTimer = null;

let activities = [];
let rideChart = null;
let summaryChart = null;

/* ---------- Helpers ---------- */
function now() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function format(sec) {
  return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
}

function toggleUI() {
  const t = document.getElementById("activityType").value;

  const isRide = t === "ride";
  const isFood = t === "food";

  document.getElementById("parkBlock").style.display = isRide ? "block" : "none";
  document.getElementById("rideBlock").style.display = isRide ? "block" : "none";
  document.getElementById("queueBox").style.display = isRide ? "block" : "none";
  document.getElementById("rideBox").style.display = isRide ? "block" : "none";

  document.getElementById("addActivityBtn").style.display = isRide ? "none" : "block";
  document.getElementById("foodDetailsBlock").style.display = isFood ? "block" : "none";
}

function loadRides() {
  const park = document.getElementById("parkSelect").value;
  const sel = document.getElementById("rideSelect");
  sel.innerHTML = "";
  if (!park) {
    sel.innerHTML = "<option>Select a park first...</option>";
    return;
  }
  rideData[park].forEach(r => {
    const o = document.createElement("option");
    o.value = r;
    o.textContent = r;
    sel.appendChild(o);
  });
}

/* ---------- Timers ---------- */
function startQueue() {
  clearInterval(queueTimer);
  queueTimer = setInterval(() => {
    queueSeconds++;
    document.getElementById("queueTime").textContent = format(queueSeconds);
  }, 1000);
  document.getElementById("queueStart").disabled = true;
  document.getElementById("queueStop").disabled = false;
}

function stopQueue() {
  clearInterval(queueTimer);
  queueTimer = null;
  startRide();
  document.getElementById("queueStop").disabled = true;
}

function startRide() {
  clearInterval(rideTimer);
  rideTimer = setInterval(() => {
    rideSeconds++;
    document.getElementById("rideTime").textContent = format(rideSeconds);
  }, 1000);
  document.getElementById("rideStop").disabled = false;
}

function stopRide() {
  clearInterval(rideTimer);
  rideTimer = null;
  saveRide();
  resetAll();
}

/* ---------- Full Reset ---------- */
function resetAll() {
  clearInterval(queueTimer);
  clearInterval(rideTimer);
  queueTimer = null;
  rideTimer = null;

  queueSeconds = 0;
  rideSeconds = 0;

  document.getElementById("queueTime").textContent = "00:00";
  document.getElementById("rideTime").textContent = "00:00";

  document.getElementById("queueStart").disabled = false;
  document.getElementById("queueStop").disabled = true;
  document.getElementById("rideStop").disabled = true;

  document.getElementById("activityType").value = "ride";
  document.getElementById("parkSelect").value = "";
  document.getElementById("rideSelect").innerHTML = "<option>Select a park first...</option>";
  document.getElementById("foodDetails").value = "";
  document.getElementById("foodCost").value = "";

  toggleUI();
}

/* ---------- Save Ride ---------- */
function saveRide() {
  const park = document.getElementById("parkSelect").value;
  const ride = document.getElementById("rideSelect").value;

  activities.push({
    type: "ride",
    timestamp: now(),
    park,
    ride,
    wait: Math.floor(queueSeconds/60),
    duration: Math.floor(rideSeconds/60),
    details: null,
    cost: 0
  });

  render();
  updateRideChart();
  updateSummaryChart();
}

/* ---------- Non-ride activity ---------- */
function addNonRide() {
  const type = document.getElementById("activityType").value;

  let details = null;
  let cost = 0;

  if (type === "food") {
    details = document.getElementById("foodDetails").value.trim();
    cost = parseFloat(document.getElementById("foodCost").value || "0");
  }

  activities.push({
    type,
    timestamp: now(),
    park: null,
    ride: null,
    wait: null,
    duration: null,
    details,
    cost
  });

  render();
  updateRideChart();
  updateSummaryChart();
  resetAll();
}

/* ---------- Edit / Delete ---------- */
function del(i) {
  activities.splice(i,1);
  render();
  updateRideChart();
  updateSummaryChart();
}

function edit(i) {
  const a = activities[i];
  const box = document.createElement("div");
  box.className = "edit-section";

  if (a.type === "ride") {
    box.innerHTML = `
      <strong>Edit Ride</strong><br>
      Park: <input id="editPark" value="${a.park}"><br>
      Ride: <input id="editRide" value="${a.ride}"><br>
      Wait: <input id="editWait" type="number" value="${a.wait}"><br>
      Duration: <input id="editDuration" type="number" value="${a.duration}"><br>
      <button onclick="saveEdit(${i})">Save</button>
    `;
  } else if (a.type === "food") {
    box.innerHTML = `
      <strong>Edit Food</strong><br>
      Details:<br>
      <textarea id="editDetails">${a.details || ""}</textarea><br>
      Cost: $ <input id="editCost" type="number" step="0.01" value="${a.cost}"><br>
      <button onclick="saveEdit(${i})">Save</button>
    `;
  } else {
    box.innerHTML = `
      <strong>Edit Activity</strong><br>
      Type: <input id="editType" value="${a.type}"><br>
      <button onclick="saveEdit(${i})">Save</button>
    `;
  }
  document.getElementById("activityList").children[i].appendChild(box);
}

function saveEdit(i) {
  const a = activities[i];

  if (a.type === "ride") {
    activities[i] = {
      ...a,
      park: document.getElementById("editPark").value,
      ride: document.getElementById("editRide").value,
      wait: parseInt(document.getElementById("editWait").value),
      duration: parseInt(document.getElementById("editDuration").value)
    };
  } else if (a.type === "food") {
    activities[i] = {
      ...a,
      details: document.getElementById("editDetails").value.trim(),
      cost: parseFloat(document.getElementById("editCost").value || "0")
    };
  } else {
    activities[i] = {
      ...a,
      type: document.getElementById("editType").value
    };
  }

  render();
  updateRideChart();
  updateSummaryChart();
}

/* ---------- Render Timeline ---------- */
function render() {
  const list = document.getElementById("activityList");
  list.innerHTML = "";

  activities.forEach((a,i)=>{
    let text="";

    if (a.type==="ride") {
      text = `${i+1}. [${a.timestamp}] Ride: ${a.ride} (${a.park}) — Wait ${a.wait} min, Ride ${a.duration} min`;
    }
    else if (a.type==="food") {
      text = `${i+1}. [${a.timestamp}] Food — ${a.details} ($${a.cost.toFixed(2)})`;
    }
    else {
      const names = {
        bathroom:"Bathroom Break",
        security:"Security Check",
        enterPark:"Entered Park",
        exitPark:"Left Park",
        leftHotel:"Left Hotel"
      };
      text = `${i+1}. [${a.timestamp}] ${names[a.type]}`;
    }

    const div = document.createElement("div");
    div.className = "activity-item";
    div.innerHTML = `
      ${text}
      <span>
        <button onclick="edit(${i})">Edit</button>
        <button onclick="del(${i})">Delete</button>
      </span>`;
    list.appendChild(div);
  });

  const r = activities.filter(x=>x.type==="ride");
  const total = r.reduce((s,x)=>s+x.wait,0);
  const avg = r.length?(total/r.length).toFixed(1):0;

  document.getElementById("stats").textContent =
    r.length ? `Total Wait: ${total} min | Avg Wait: ${avg} min` : "";
}

/* ---------- Ride Wait/Ride Time Chart ---------- */
function updateRideChart() {
  const rides = activities.filter(a=>a.type==="ride");
  const labels = rides.map(r=>r.ride);
  const wait = rides.map(r=>r.wait);
  const dur = rides.map(r=>r.duration);

  if (rideChart) rideChart.destroy();

  rideChart = new Chart(document.getElementById("rideChart"),{
    type:"bar",
    data:{
      labels,
      datasets:[
        { label:"Wait Time", data:wait, backgroundColor:"#FF6384" },
        { label:"Ride Time", data:dur, backgroundColor:"#36A2EB" }
      ]
    },
    options:{ scales:{ y:{ beginAtZero:true } } }
  });
}

/* ---------- Summary Bar Chart ---------- */
function updateSummaryChart() {
  const rides = activities.filter(a=>a.type==="ride").length;
  const queueSum = activities.filter(a=>a.type==="ride").reduce((s,r)=>s+r.wait,0);
  const rideSum = activities.filter(a=>a.type==="ride").reduce((s,r)=>s+r.duration,0);
  const bathrooms = activities.filter(a=>a.type==="bathroom").length;
  const foods = activities.filter(a=>a.type==="food").length;
  const costSum = activities.filter(a=>a.type==="food").reduce((s,f)=>s+f.cost,0);

  if (summaryChart) summaryChart.destroy();

  summaryChart = new Chart(document.getElementById("summaryChart"),{
    type:"bar",
    data:{
      labels:[
        "Rides",
        "Queue Time (min)",
        "Ride Time (min)",
        "Bathroom Breaks",
        "Food Purchases",
        "Food Cost ($)"
      ],
      datasets:[
        {
          label:"Daily Totals",
          data:[ rides, queueSum, rideSum, bathrooms, foods, costSum ],
          backgroundColor:[
            "#4BC0C0","#FF9F40","#36A2EB","#9966FF","#FF6384","#4CAF50"
          ]
        }
      ]
    },
    options:{ responsive:true, scales:{ y:{ beginAtZero:true } } }
  });
}
</script>
</body>
</html>
